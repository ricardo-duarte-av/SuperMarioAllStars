# Builds the Linux AppImage (without a ROM: players supply their own) on every
# push, and keeps it as the run's artifact. Ubuntu 22.04 on purpose: an AppImage
# runs on distributions with the glibc it was built with or newer, and 22.04's
# (2.35) is older than most in use.
#
# Releases:
#   - a push to main replaces the AppImage on the rolling "continuous"
#     pre-release (the newest build; its tag is moved to that commit);
#   - a pushed tag v* (git tag v1.1 && git push origin v1.1) makes a release of
#     that name with the AppImage.
name: Linux AppImage

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # (the releases)

# (one run at a time per branch or tag: two pushes in a row can't race on the "continuous" release)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_FILE: dist/SuperMarioAllStars-norom-x86_64.AppImage
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config file \
            libsdl2-dev libgles-dev \
            fontconfig fonts-dejavu-core fonts-noto-core

      - name: Build the program and the AppImage (no ROM)
        run: ./build.sh --no-rom

      - name: Check the AppImage
        run: |
          set -e
          f="$APPIMAGE_FILE"
          test -x "$f"
          file "$f"
          # (no ROM may ever be in it)
          if find build_linux/AppDir \( -iname '*.sfc' -o -iname '*.smc' \) | grep .; then
            echo "a ROM is in the AppDir" >&2
            exit 1
          fi
          APPIMAGE_EXTRACT_AND_RUN=1 "$f" --help

      - uses: actions/upload-artifact@v4
        with:
          name: SuperMarioAllStars-norom-x86_64-AppImage
          path: ${{ env.APPIMAGE_FILE }}
          if-no-files-found: error

      - name: Publish the rolling "continuous" pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          notes="The newest build of main (${GITHUB_SHA::7}), built $(date -u '+%Y-%m-%d %H:%M UTC').

          Linux x86_64 AppImage, without the game: put your own Super Mario All-Stars (USA) ROM
          (CRC32 925637C7) in a \`roms\` folder beside the AppImage, drop it on the window, or click
          the game card to choose it. Settings and saves are kept beside the AppImage."
          # (the tag follows main; pushes made with this token start no new runs)
          git tag -f continuous "$GITHUB_SHA"
          git push -f origin refs/tags/continuous
          if gh release view continuous >/dev/null 2>&1; then
            gh release edit continuous --prerelease --title "Continuous build" --notes "$notes"
            gh release upload continuous "$APPIMAGE_FILE" --clobber
          else
            gh release create continuous "$APPIMAGE_FILE" --prerelease --title "Continuous build" \
              --notes "$notes" --target "$GITHUB_SHA"
          fi

      - name: Publish the release for the tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="$GITHUB_REF_NAME"
          asset="dist/SuperMarioAllStars-$tag-norom-x86_64.AppImage"
          cp "$APPIMAGE_FILE" "$asset"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --title "Super Mario All-Stars $tag" --generate-notes --verify-tag
          fi
